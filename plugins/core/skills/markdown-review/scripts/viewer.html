<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Review</title>
<style>
:root {
  --bg: #ffffff; --bg2: #f6f8fa; --fg: #1f2328; --fg2: #59636e;
  --border: #d1d9e0; --accent: #0969da; --ok: #1a7f37; --warn: #9a6700; --err: #cf222e;
  --mark: #fff8c5; --status-color: var(--fg2);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --bg2: #151b23; --fg: #f0f6fc; --fg2: #9198a1;
    --border: #3d444d; --accent: #4493f8; --ok: #3fb950; --warn: #d29922; --err: #f85149;
    --mark: #3a3000;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: grid; grid-template-columns: 260px 1fr;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg); color: var(--fg);
}
#sidebar { background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; padding: 0.75rem; }
#sidebar h1 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg2); margin: 0.25rem 0.5rem 0.75rem; }
#doclist { list-style: none; margin: 0; padding: 0; }
#doclist li {
  display: flex; align-items: center; gap: 0.5rem; padding: 0.45rem 0.5rem;
  border-radius: 6px; cursor: pointer; font-size: 0.9rem;
}
#doclist li:hover { background: var(--border); }
#doclist li.active { background: var(--accent); color: #fff; }
#doclist .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#doclist .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex-shrink: 0; }
#doclist .check { color: var(--ok); flex-shrink: 0; }
#doclist li.active .check { color: #fff; }
#main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
#header {
  display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 1.25rem;
  border-bottom: 1px solid var(--border); background: var(--bg2);
}
#docheader { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#header .spacer { flex: 1; }
.status { font-size: 0.75rem; color: var(--status-color); white-space: nowrap; }
.status::before { content: "●"; margin-right: 0.3em; }
#approve {
  border: 1px solid var(--ok); color: var(--ok); background: transparent;
  border-radius: 6px; padding: 0.3rem 0.9rem; font-size: 0.85rem; cursor: pointer;
}
#approve:hover { background: var(--ok); color: #fff; }
#approve.approved { background: var(--ok); color: #fff; }
#doc { flex: 1; overflow-y: auto; padding: 2rem 3rem; max-width: 100%; }
#doc > * { max-width: 820px; }
#footer { display: flex; gap: 0.5rem; padding: 0.6rem 1.25rem; border-top: 1px solid var(--border); background: var(--bg2); }
#doc-comment {
  flex: 1; resize: none; height: 2.4rem; padding: 0.5rem; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg); color: var(--fg); font-family: inherit;
}
#send-doc-comment {
  border: 1px solid var(--accent); color: var(--accent); background: transparent;
  border-radius: 6px; padding: 0 1rem; cursor: pointer;
}
#send-doc-comment:hover { background: var(--accent); color: #fff; }
/* markdown */
#doc h1, #doc h2 { border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
#doc a { color: var(--accent); }
#doc img { max-width: 100%; }
#doc pre { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; overflow-x: auto; }
#doc code { background: var(--bg2); border-radius: 4px; padding: 0.1em 0.3em; font-size: 0.9em; }
#doc pre code { background: none; padding: 0; }
#doc blockquote { border-left: 4px solid var(--border); margin-left: 0; padding-left: 1rem; color: var(--fg2); }
#doc table { border-collapse: collapse; }
#doc th, #doc td { border: 1px solid var(--border); padding: 0.4rem 0.8rem; }
#doc tr:nth-child(2n) { background: var(--bg2); }
/* comment affordances */
.block { position: relative; border-radius: 4px; }
.block:hover { outline: 2px solid var(--border); outline-offset: 6px; cursor: pointer; }
.block.commented { border-left: 3px solid var(--warn); padding-left: 0.75rem; margin-left: -0.75rem; }
.popover {
  max-width: 820px; margin: 0.5rem 0 1rem; padding: 0.75rem; border-radius: 8px;
  border: 1px solid var(--accent); background: var(--bg2);
}
.popover .sel { font-size: 0.85rem; }
.popover textarea {
  width: 100%; min-height: 4rem; resize: vertical; padding: 0.5rem; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg); color: var(--fg); font-family: inherit;
}
.popover .row { display: flex; gap: 0.5rem; margin-top: 0.5rem; justify-content: flex-end; }
.popover button { border-radius: 6px; padding: 0.3rem 0.9rem; cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--fg); }
.popover button.save { border-color: var(--accent); color: var(--accent); }
.popover button.save:hover { background: var(--accent); color: #fff; }
.empty { color: var(--fg2); font-style: italic; }
#toast {
  position: fixed; bottom: 4.5rem; right: 1.5rem; padding: 0.5rem 1rem; border-radius: 6px;
  background: var(--fg); color: var(--bg); font-size: 0.85rem; opacity: 0; transition: opacity 0.2s;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>
<nav id="sidebar">
  <h1>Documents</h1>
  <ul id="doclist"></ul>
</nav>
<main id="main">
  <header id="header">
    <span id="docheader">Loading…</span>
    <span class="spacer"></span>
    <span class="status">Connecting…</span>
    <button id="approve">Approve</button>
  </header>
  <section id="doc"><p class="empty">No documents yet — the agent will add some.</p></section>
  <footer id="footer">
    <textarea id="doc-comment" placeholder="Overall feedback on this document…"></textarea>
    <button id="send-doc-comment">Send</button>
  </footer>
</main>
<div id="toast"></div>
<!-- MARKED_JS -->
<!-- VIEWER_JS -->
</body>
</html>
